<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>收到你的資料 | PostAIAge</title>
  <link rel="stylesheet" href="css/style.css?v=7">
  <style>
    .thanks-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%);
    }
    .thanks-card {
      background: #fff;
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      animation: fadeSlideIn 0.5s ease;
    }
    .thanks-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 3px solid #2563eb;
    }
    .thanks-avatar-placeholder {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #2563eb;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      margin: 0 auto 1rem;
    }
    .thanks-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
    }
    .thanks-email {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .thanks-badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .thanks-badge--planA {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .thanks-badge--planB {
      background: #fce4ec;
      color: #c62828;
    }
    .thanks-message {
      font-size: 1.1rem;
      color: #333;
      margin-bottom: 0.5rem;
    }
    .thanks-sub {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }
    .thanks-back {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #2563eb;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: filter 0.2s;
    }
    .thanks-back:hover {
      filter: brightness(1.1);
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="thanks-container">
    <div class="thanks-card">
      <!-- Filled from the signed-in member's profile: Google photo or initial -->
      <div id="thanksAvatar"></div>
      <h2 class="thanks-name" id="thanksName">歡迎加入社群！</h2>
      <p class="thanks-email" id="thanksEmail" hidden></p>
      <div id="thanksBadge"></div>
      <p class="thanks-message" id="thanksMessage"></p>
      <p class="thanks-sub">社群帳戶已建立。這不是服務預約；若你想談自己的工作問題，請提交服務申請，我們會再與你確認時間。</p>
      <a href="/chat" class="thanks-back">進入交流社群</a>
    </div>
  </div>

  <script src="js/cookies.js"></script>
  <script type="module">
    import './js/auth.js?v=8';

    // Read the member's own profile rather than URL parameters, so names and
    // emails never travel in the address bar and nothing untrusted is rendered.
    window.addEventListener('postaiage:authchange', (event) => {
      const { user, profile } = event.detail;
      if (!user) {
        window.location.replace('/register');
        return;
      }

      const plan = profile?.plan === 'B' ? 'B' : 'A';
      const name = profile?.name || user.displayName || '新夥伴';
      const avatar = profile?.avatar || user.photoURL || '';

      const avatarContainer = document.getElementById('thanksAvatar');
      if (/^https:\/\//.test(avatar)) {
        const img = document.createElement('img');
        img.className = 'thanks-avatar';
        img.src = avatar;
        img.alt = '';
        img.referrerPolicy = 'no-referrer';
        avatarContainer.replaceChildren(img);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'thanks-avatar-placeholder';
        placeholder.textContent = (Array.from(name)[0] || '?').toUpperCase();
        avatarContainer.replaceChildren(placeholder);
      }

      document.getElementById('thanksName').textContent = '歡迎加入社群，' + name + '！';

      const emailEl = document.getElementById('thanksEmail');
      emailEl.textContent = user.email || '';
      emailEl.hidden = !user.email;

      const badge = document.getElementById('thanksBadge');
      badge.className = 'thanks-badge thanks-badge--plan' + plan;
      badge.textContent = plan === 'B' ? '團隊夥伴' : '個人夥伴';

      document.getElementById('thanksMessage').textContent = plan === 'B'
        ? '歡迎分享你對團隊 AI 協作的想法，和夥伴一起交流實際做法。'
        : '歡迎分享你正在摸索的工作改變，也看看夥伴們如何把 AI 用進日常。';

      if (window.PostAIAgeCookies) {
        window.PostAIAgeCookies.markRegistered(plan);
      }
    }, { once: true });
  </script>
</body>
</html>
