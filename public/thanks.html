<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登記成功 | PostAIAge</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .thanks-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%);
    }
    .thanks-card {
      background: #fff;
      border-radius: 20px;
      padding: 3rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
      animation: fadeSlideIn 0.5s ease;
    }
    .thanks-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 1rem;
      border: 3px solid #2563eb;
    }
    .thanks-avatar-placeholder {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #2563eb;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      margin: 0 auto 1rem;
    }
    .thanks-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.25rem;
    }
    .thanks-email {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .thanks-badge {
      display: inline-block;
      padding: 0.4rem 1rem;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .thanks-badge--planA {
      background: #e8f5e9;
      color: #2e7d32;
    }
    .thanks-badge--planB {
      background: #fce4ec;
      color: #c62828;
    }
    .thanks-message {
      font-size: 1.1rem;
      color: #333;
      margin-bottom: 0.5rem;
    }
    .thanks-sub {
      color: #888;
      font-size: 0.85rem;
      margin-bottom: 2rem;
    }
    .thanks-back {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #2563eb;
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: filter 0.2s;
    }
    .thanks-back:hover {
      filter: brightness(1.1);
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="thanks-container">
    <div class="thanks-card">
      <!-- Avatar: Google users get real photo, Email users get initial -->
      <div id="thanksAvatar"></div>
      <h2 class="thanks-name" id="thanksName"></h2>
      <p class="thanks-email" id="thanksEmail"></p>
      <div id="thanksBadge"></div>
      <p class="thanks-message" id="thanksMessage"></p>
      <p class="thanks-sub">我哋會喺服務上線時第一時間通知你。Stay tuned! 🚀</p>
      <a href="/" class="thanks-back">返回主頁</a>
    </div>

    <!-- Conversion Attribution Summary (hidden, for analytics) -->
    <p id="conversionAttribution" style="display:none;margin-top:1.5rem;font-size:0.8rem;color:var(--text-muted);text-align:center;"></p>
  </div>

  <script src="js/cookies.js"></script>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const plan = params.get('plan') || 'A';
      const method = params.get('method') || 'email';
      const name = params.get('name') || 'Early Bird';
      const email = params.get('email') || '';
      const avatar = params.get('avatar') || '';

      // Avatar
      const avatarContainer = document.getElementById('thanksAvatar');
      if (avatar) {
        avatarContainer.innerHTML = '<img src="' + avatar + '" alt="' + name + '" class="thanks-avatar" referrerpolicy="no-referrer">';
      } else {
        const initial = name.charAt(0).toUpperCase();
        avatarContainer.innerHTML = '<div class="thanks-avatar-placeholder">' + initial + '</div>';
      }

      // Name
      document.getElementById('thanksName').textContent = '歡迎加入，' + name + '！';

      // Email (only for email method)
      if (email) {
        document.getElementById('thanksEmail').textContent = email;
      } else {
        document.getElementById('thanksEmail').style.display = 'none';
      }

      // Badge
      const badge = document.getElementById('thanksBadge');
      if (plan === 'B') {
        badge.className = 'thanks-badge thanks-badge--planB';
        badge.textContent = '🔥 限量早鳥資格已鎖定';
      } else {
        badge.className = 'thanks-badge thanks-badge--planA';
        badge.textContent = '📩 上線通知已登記';
      }

      // Message
      const msg = document.getElementById('thanksMessage');
      if (plan === 'B') {
        msg.textContent = '你已成功鎖定 6 折最低價同所有早鳥權益！';
      } else {
        msg.textContent = '服務上線時你會第一時間收到 8 折優惠碼！';
      }

      // ── Cookie: Mark session as registered ─────────────────
      if (window.PostAIAgeCookies) {
        window.PostAIAgeCookies.markRegistered(plan);

        // Optional: Show conversion attribution in console for debugging
        var v = window.PostAIAgeCookies.getVisitData();
        if (v) {
          var attrEl = document.getElementById('conversionAttribution');
          if (attrEl) {
            attrEl.style.display = 'block';
            attrEl.textContent = '📊 Visit #' + v.visitCount + ' | Landing: ' + v.landingPage + ' | ' + (v.referrer !== 'direct' ? 'Referred by: ' + v.referrer : 'Direct traffic');
          }

          // Also record conversion event if tracker is available
          if (typeof window.recordRegistration === 'function') {
            // Already recorded by earlybird.js, but ensure visit context is there
            console.log('PostAIAge: conversion attributed — visit #' + v.visitCount +
              ', referrer=' + v.referrer +
              ', daysSinceFirst=' + (window.PostAIAgeCookies.daysSinceFirstVisit()));
          }
        }
      }
    })();
  </script>
</body>
</html>
